name: CECS 3.0 DEFENSIVE daily forward paper

on:
  workflow_dispatch:
  schedule:
    - cron: '35 9 * * *'
  push:
    branches: [main]
    paths:
      - 'cecs3_forward.py'
      - 'test_cecs3_forward.py'
      - '.github/workflows/cecs3-forward.yml'

permissions:
  contents: write

concurrency:
  group: cecs-forward-paper-journal
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CECS3 strategy and paper accounting regression tests
        run: python -m unittest -v test_cecs3.py test_cecs3_forward.py
      - name: UTC daily Bitstamp published-signal and sampled-quote virtual decision
        run: python cecs3_forward.py
      - name: Preserve dated virtual evidence and derived account together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cecs3_forward/
          if git diff --cached --quiet; then
            echo "No new observation; no duplicate trading."
          else
            git commit -m "CECS3 independent forward paper $(date -u +%F)"
            git push
          fi
      - name: Backup current virtual-account evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cecs3-defensive-forward-paper
          path: cecs3_forward/
          retention-days: 90
          if-no-files-found: warn
