name: CECS 3.0 DEFENSIVE daily forward paper

on:
  workflow_dispatch:
  schedule:
    - cron: '35 9 * * *'
  push:
    branches: [main]
    paths:
      - 'cecs3_forward.py'
      - 'test_cecs3_forward.py'
      - '.github/workflows/cecs3-forward.yml'

permissions:
  contents: write

concurrency:
  group: cecs-forward-paper-journal
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all frozen strategy dependencies against launch commit
        run: |
          set -euo pipefail
          frozen="dc7fe3cbce7d5d0678581a22f78ff8b27c30d895"
          for file in \
            cecs_v3_0_strategy.py \
            cecs_v2_7_slow.py \
            cecs_v2_6_mw.py \
            cecs_v2_3_trend.py \
            cecs_v2_2_intraday.py \
            cecs_v2_1_runner.py
          do
            git show "$frozen:$file" | cmp - "$file" || {
              echo "::error::Frozen CECS3 dependency changed: $file. New model version required."
              exit 1
            }
          done
          echo "All CECS3 strategy dependencies exactly match launch commit $frozen."
      - name: CECS3 strategy and paper accounting regression tests
        run: python -m unittest -v test_cecs3.py test_cecs3_forward.py
      - name: UTC daily Bitstamp published-signal and sampled-quote virtual decision
        run: python cecs3_forward.py
      - name: Preserve dated virtual evidence and derived account together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cecs3_forward/
          if git diff --cached --quiet; then
            echo "No new observation; no duplicate trading."
          else
            git commit -m "CECS3 independent forward paper $(date -u +%F)"
            git push
          fi
      - name: Backup current virtual-account evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cecs3-defensive-forward-paper
          path: cecs3_forward/
          retention-days: 90
          if-no-files-found: warn
