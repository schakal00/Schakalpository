name: CECS 3.0 DEFENSIVE daily forward paper

on:
  workflow_dispatch:
  schedule:
    - cron: '35 9 * * *'
  push:
    branches: [main]
    paths:
      - 'cecs3_forward.py'
      - 'test_cecs3_forward.py'
      - '.github/workflows/cecs3-forward.yml'

permissions:
  contents: write

concurrency:
  group: cecs-forward-paper-journal
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen Git blob identities of CECS3 strategy dependencies
        run: |
          set -euo pipefail
          cat > /tmp/cecs3-frozen-blobs.txt <<'BLOBS'
          59ba6c85f095dde98f88c3b677cc7e0d3f111f68 cecs_v3_0_strategy.py
          aa1de2bd5f87c50fa9f647f6362db531c7ac9e8d cecs_v2_7_slow.py
          f7bba61da6956772e9e087e3ab9f5587f27ca9e0 cecs_v2_6_mw.py
          b5a68a3e89c71c8f9357ba29b7ba678bf5d1b45f cecs_v2_3_trend.py
          8ae2158c2b7e8af7bc6943b4d9944c81dbb5947e cecs_v2_2_intraday.py
          a3cefa68bde75e44eb2242743d79c03cbd10a9a3 cecs_v2_1_runner.py
          BLOBS
          while read -r expected file; do
            actual="$(git hash-object "$file")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Frozen dependency changed: $file"
              exit 1
            fi
          done < /tmp/cecs3-frozen-blobs.txt
          echo "All CECS3 strategy dependencies match their frozen blobs."
      - name: CECS3 strategy and paper accounting regression tests
        run: python -m unittest -v test_cecs3.py test_cecs3_forward.py
      - name: UTC daily Bitstamp published-signal and sampled-quote virtual decision
        run: python cecs3_forward.py
      - name: Preserve dated virtual evidence and derived account together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cecs3_forward/
          if git diff --cached --quiet; then
            echo "No new observation; no duplicate trading."
          else
            git commit -m "CECS3 independent forward paper $(date -u +%F)"
            git push
          fi
      - name: Backup current virtual-account evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cecs3-defensive-forward-paper
          path: cecs3_forward/
          retention-days: 90
          if-no-files-found: warn
