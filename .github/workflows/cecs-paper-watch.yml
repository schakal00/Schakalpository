name: CECS 2.5 forward paper journal

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches: [main]
    paths:
      - 'daily_watch.py'
      - 'test_daily_watch.py'
      - 'paper_engine.py'
      - 'test_paper_engine.py'
      - '.github/workflows/cecs-paper-watch.yml'

permissions:
  contents: write

concurrency:
  group: cecs-forward-paper-journal
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Forward causality and execution tests
        run: python -m unittest -v test_daily_watch.py test_trend.py test_paper_engine.py
      - name: Make immutable observation of published daily BTC OHLCV (no orders)
        run: python daily_watch.py --out paper_watch
      - name: Capture live Bitstamp quote and update forward-only VIRTUAL ledger
        run: python paper_engine.py --watch paper_watch --out paper_execution
      - name: Commit state and daily event together (never edit dated evidence)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_watch/ paper_execution/
          if git diff --cached --quiet; then
            echo 'No new forward observation.'
          else
            git commit -m "CECS 2.5 UTC paper observation $(date -u +%F)"
            git push
          fi
      - name: Backup audit and paper state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cecs-forward-paper-evidence
          path: |
            paper_watch/
            paper_execution/
          retention-days: 90
          if-no-files-found: warn
