name: CECS BTC research audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cecs_v2_1_runner.py'
      - 'test_cecs_runner.py'
      - '.github/workflows/cecs-btc.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest -v test_cecs_runner.py
      - name: Fetch public Bitstamp daily OHLCV and run historical study
        run: |
          python cecs_v2_1_runner.py --out results
      - name: Store reproducibility manifest and research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cecs-btc-research-results
          path: results/
          if-no-files-found: warn
          retention-days: 30
